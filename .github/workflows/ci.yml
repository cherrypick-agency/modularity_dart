name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: melos run analyze

      - name: Run Tests
        run: melos run test:all

      - name: Run Tests with Coverage
        run: melos run test:coverage

      - name: Verify publishable packages
        run: |
          for pkg in packages/contracts packages/core packages/flutter packages/modularity_injectable packages/adapters/modularity_get_it packages/modularity_cli packages/modularity_test; do
            echo "Checking $pkg..."
            (cd $pkg && dart pub publish --dry-run)
          done
