name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Dart pub global path
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install dartdoc_modern
        run: dart pub global activate --source git https://github.com/777genius/dartdoc_modern.git

      - name: Generate docs
        run: >
          dart pub global run dartdoc_modern
          --format jaspr
          --workspace-docs
          --exclude-packages 'complex_app,complex_mobx,example,example_auto_route,example_bloc,example_go_router,example_riverpod,modularity_injectable_example,test_utils'
          --output docs-site

      # dartdoc_modern generates web/guide/<name>.html with <meta http-equiv="refresh">.
      # On GitHub Pages these .html files take priority over Jaspr SSR
      # guide/<name>/index.html, causing an infinite redirect loop.
      # DO NOT REMOVE this step - the redirect loop WILL come back.
      - name: Remove legacy guide redirect files
        run: find docs-site/web/guide -name '*.html' -delete 2>/dev/null || true

      - name: Install docs dependencies
        working-directory: docs-site
        run: dart pub get

      - name: Build docs (jaspr)
        working-directory: docs-site
        run: dart run jaspr_cli:jaspr build --dart-define DOCS_BASE_PATH=/modularity_dart
        timeout-minutes: 10

      - name: Assemble site
        run: cp -r docs-site/build/jaspr _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
