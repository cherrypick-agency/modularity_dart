name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cache Dart pub dependencies for faster builds
      - name: Cache Dart pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-cache-

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dartdoc-vitepress
        run: dart pub global activate --source git https://github.com/777genius/dartdoc_vitepress.git --git-ref 2a693eb7ce5633e79d91e5593e8e185ebe2fd9f2

      # Generate API docs and sidebar files from Dart source code
      - name: Generate API docs
        run: |
          dart pub global run dartdoc_vitepress \
            --format vitepress \
            --workspace-docs \
            --exclude-packages 'complex_app,complex_mobx,example,example_auto_route,example_bloc,example_go_router,example_riverpod,modularity_injectable_example,test_utils' \
            --output docs-site

      - name: Install dependencies
        run: npm ci
        working-directory: docs-site

      - name: Build VitePress site
        run: npx vitepress build
        working-directory: docs-site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
