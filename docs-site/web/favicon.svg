  <path d="M43 29.5h10M29.5 43v10M66.5 43v10M43 66.5h10" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Small dots at connection points -->
  <circle cx="48" cy="29.5" r="2" fill="white" opacity="0.7"/>
  <circle cx="29.5" cy="48" r="2" fill="white" opacity="0.7"/>
  <circle cx="66.5" cy="48" r="2" fill="white" opacity="0.7"/>
  <circle cx="48" cy="66.5" r="2" fill="white" opacity="0.7"/>
