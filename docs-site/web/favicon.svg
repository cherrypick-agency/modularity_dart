<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="mod-bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="mod-block" x1="12" y1="12" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#mod-bg)"/>
  <!-- 4 module blocks in a grid -->
  <rect x="16" y="16" width="27" height="27" rx="7" fill="url(#mod-block)" opacity="0.95"/>
  <rect x="53" y="16" width="27" height="27" rx="7" fill="url(#mod-block)" opacity="0.7"/>
  <rect x="16" y="53" width="27" height="27" rx="7" fill="url(#mod-block)" opacity="0.7"/>
  <rect x="53" y="53" width="27" height="27" rx="7" fill="url(#mod-block)" opacity="0.45"/>
